packages:
  - "apps/*"
  - "packages/*"

# Allow post-install build scripts only for tools that genuinely need them.
allowBuilds:
  esbuild: true
  lefthook: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  "@parcel/watcher": false
  "@swc/core": false
  # bullmq's msgpackr dep — native build is a pure perf optimization with a
  # JS fallback if skipped; deny like the other native-build deps above.
  msgpackr-extract: false
