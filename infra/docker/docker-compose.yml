name: shopnetic

# Local service dependencies for development.
#
# Host ports are deliberately non-default (5433 / 6380) so this stack can run
# alongside another Postgres/Redis already bound to 5432/6379 on the same
# machine. Container-internal ports are unchanged. `.env.example` files point at
# these host ports.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopnetic
      POSTGRES_PASSWORD: shopnetic
      POSTGRES_DB: shopnetic
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopnetic']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP

volumes:
  pgdata:
